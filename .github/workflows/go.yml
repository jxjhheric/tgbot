name: Go Build

on:
  push:
    branches:
      - go-vps-systemd
  pull_request:
    branches:
      - go-vps-systemd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Test
        run: go mod tidy && go test ./...

      - name: Build Linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o tgbot ./cmd/tgbot

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: tgbot-linux-amd64
          path: |
            tgbot
            .env.go.example
            deploy/systemd/tgbot.service
          retention-days: 30

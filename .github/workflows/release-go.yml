name: Release Go VPS Binary

on:
  push:
    tags:
      - "go-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          go test ./...
          mkdir -p release/tgbot-linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o release/tgbot-linux-amd64/tgbot ./cmd/tgbot
          tar -C release -czf tgbot-linux-amd64.tar.gz tgbot-linux-amd64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: tgbot-linux-amd64.tar.gz
